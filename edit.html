<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;

    min-height:100vh;

    color:white;

    padding:25px 15px 50px;

    background:
        radial-gradient(
            circle at 10% 15%,
            rgba(124,58,237,.35),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(236,72,153,.25),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #04040a,
            #10091f,
            #050509
        );
}

.container{
    width:100%;
    max-width:750px;
    margin:auto;
}

h1{
    text-align:center;

    font-size:42px;

    margin:25px 0 8px;
}

.subtitle{
    text-align:center;

    color:#aaa8b8;

    margin-bottom:30px;
}

.card{
    padding:25px;

    margin-bottom:20px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.035)
        );

    border:
        1px solid rgba(255,255,255,.13);

    backdrop-filter:blur(20px);
}

.card h2{
    font-size:24px;

    margin-bottom:20px;

    color:#d8b4fe;
}

label{
    display:block;

    font-size:14px;

    color:#ddd6fe;

    margin:15px 0 7px;
}

input,
textarea{
    width:100%;

    padding:14px 15px;

    border-radius:13px;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        rgba(0,0,0,.25);

    color:white;

    outline:none;

    font-family:Arial,sans-serif;

    font-size:15px;
}

textarea{
    min-height:100px;

    resize:vertical;
}

input:focus,
textarea:focus{

    border-color:#a855f7;

    box-shadow:
        0 0 0 3px
        rgba(168,85,247,.12);
}

button{

    width:100%;

    padding:16px;

    margin-top:10px;

    border:0;

    border-radius:50px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #c026d3,
            #ec4899
        );

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

.logout{

    background:
        rgba(239,68,68,.12);

    border:
        1px solid
        rgba(239,68,68,.25);

    box-shadow:none;
}

.success{

    display:none;

    text-align:center;

    padding:15px;

    margin-bottom:20px;

    border-radius:15px;

    background:
        rgba(34,197,94,.12);

    border:
        1px solid
        rgba(34,197,94,.25);

    color:#86efac;
}

.loading{

    text-align:center;

    padding:40px;

    color:#aaa8b8;
}

#adminPanel{

    display:none;
}

</style>

</head>


<body>


<div
    id="loading"
    class="loading"
>

    Checking secure login...

</div>


<div
    id="adminPanel"
    class="container"
>

    <h1>
        ✦ Admin Panel
    </h1>

    <p class="subtitle">
        Manage your website
    </p>


    <div
        id="success"
        class="success"
    >
        ✓ Changes saved successfully!
    </div>


    <div class="card">

        <h2>
            🏫 College Information
        </h2>


        <label>
            College Name
        </label>

        <input
            id="collegeName"
            type="text"
        >


        <label>
            Tagline
        </label>

        <input
            id="tagline"
            type="text"
        >


        <label>
            Homepage Heading
        </label>

        <input
            id="heroTitle"
            type="text"
        >


        <label>
            Homepage Description
        </label>

        <textarea
            id="heroText"
        ></textarea>

    </div>


    <div class="card">

        <h2>
            📖 About Page
        </h2>


        <label>
            About Heading
        </label>

        <input
            id="aboutTitle"
            type="text"
        >


        <label>
            About Information
        </label>

        <textarea
            id="aboutText"
        ></textarea>

    </div>


    <div class="card">

        <h2>
            🎓 Courses
        </h2>


        <label>
            Course 1 Name
        </label>

        <input
            id="course1Name"
            type="text"
        >


        <label>
            Course 1 Description
        </label>

        <textarea
            id="course1Text"
        ></textarea>


        <label>
            Course 2 Name
        </label>

        <input
            id="course2Name"
            type="text"
        >


        <label>
            Course 2 Description
        </label>

        <textarea
            id="course2Text"
        ></textarea>


        <label>
            Course 3 Name
        </label>

        <input
            id="course3Name"
            type="text"
        >


        <label>
            Course 3 Description
        </label>

        <textarea
            id="course3Text"
        ></textarea>


        <label>
            Course 4 Name
        </label>

        <input
            id="course4Name"
            type="text"
        >


        <label>
            Course 4 Description
        </label>

        <textarea
            id="course4Text"
        ></textarea>

    </div>


    <div class="card">

        <h2>
            📞 Contact Information
        </h2>


        <label>
            Email
        </label>

        <input
            id="email"
            type="email"
        >


        <label>
            Phone Number
        </label>

        <input
            id="phone"
            type="text"
        >


        <label>
            Address
        </label>

        <textarea
            id="address"
        ></textarea>

    </div>


    <div class="card">

        <button
            onclick="saveData()"
        >
            💾 Save Changes
        </button>


        <button
            class="logout"
            onclick="logout()"
        >
            🔒 Logout
        </button>

    </div>

</div>


<script>

/*
==================================================
SUPABASE
==================================================
*/

const SUPABASE_URL =
    "https://juxulvnnqyvgmttgkdsj.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_iT3pKj6z7BHYqOJEOax3HQ_uMNE9WDn";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/*
==================================================
CHECK LOGIN
==================================================
*/

async function checkLogin(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    if(
        !data.session
    ){

        window.location.href =
            "admin.html";

        return;

    }


    document
        .getElementById("loading")
        .style.display =
        "none";


    document
        .getElementById("adminPanel")
        .style.display =
        "block";


    loadData();

}


/*
==================================================
LOAD DATA
==================================================
*/

async function loadData(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("college_content")
        .select("*")
        .eq("id",1)
        .single();


    if(error){

        alert(
            "Could not load website data."
        );

        console.error(error);

        return;
    }


    const fields = [

        "college_name",
        "tagline",

        "hero_title",
        "hero_text",

        "about_title",
        "about_text",

        "course1_name",
        "course1_text",

        "course2_name",
        "course2_text",

        "course3_name",
        "course3_text",

        "course4_name",
        "course4_text",

        "email",
        "phone",
        "address"

    ];


    fields.forEach(
        function(field){

            const element =
                document.getElementById(
                    field.replace(
                        /_([a-z])/g,
                        function(
                            match,
                            letter
                        ){
                            return letter
                                .toUpperCase();
                        }
                    )
                );


            if(element){

                element.value =
                    data[field] || "";

            }

        }
    );

}


/*
==================================================
SAVE DATA
==================================================
*/

async function saveData(){

    const updateData = {

        college_name:
            document.getElementById(
                "collegeName"
            ).value,

        tagline:
            document.getElementById(
                "tagline"
            ).value,

        hero_title:
            document.getElementById(
                "heroTitle"
            ).value,

        hero_text:
            document.getElementById(
                "heroText"
            ).value,

        about_title:
            document.getElementById(
                "aboutTitle"
            ).value,

        about_text:
            document.getElementById(
                "aboutText"
            ).value,

        course1_name:
            document.getElementById(
                "course1Name"
            ).value,

        course1_text:
            document.getElementById(
                "course1Text"
            ).value,

        course2_name:
            document.getElementById(
                "course2Name"
            ).value,

        course2_text:
            document.getElementById(
                "course2Text"
            ).value,

        course3_name:
            document.getElementById(
                "course3Name"
            ).value,

        course3_text:
            document.getElementById(
                "course3Text"
            ).value,

        course4_name:
            document.getElementById(
                "course4Name"
            ).value,

        course4_text:
            document.getElementById(
                "course4Text"
            ).value,

        email:
            document.getElementById(
                "email"
            ).value,

        phone:
            document.getElementById(
                "phone"
            ).value,

        address:
            document.getElementById(
                "address"
            ).value,

        updated_at:
            new Date().toISOString()

    };


    const {
        error
    } =
    await supabaseClient
        .from("college_content")
        .update(updateData)
        .eq("id",1);


    if(error){

        alert(
            "Save failed. Database permission needs to be configured."
        );

        console.error(error);

        return;
    }


    const success =
        document.getElementById(
            "success"
        );


    success.style.display =
        "block";


    setTimeout(
        function(){

            success.style.display =
                "none";

        },
        3000
    );

}


/*
==================================================
LOGOUT
==================================================
*/

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
        "admin.html";

}


/*
==================================================
START
==================================================
*/

checkLogin();

</script>


</body>

</html>
