<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - College Portal</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:white;

    background:
        radial-gradient(circle at 10% 15%,rgba(124,58,237,.35),transparent 30%),
        radial-gradient(circle at 90% 80%,rgba(236,72,153,.25),transparent 30%),
        linear-gradient(135deg,#04040a,#10091f,#050509);

    overflow-x:hidden;
}

header{
    text-align:center;
    padding:80px 20px 50px;
}

.badge{
    display:inline-block;
    padding:9px 18px;
    border-radius:50px;

    color:#d8b4fe;
    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.15);

    letter-spacing:2px;
    font-size:13px;

    margin-bottom:25px;
}

h1{
    font-size:clamp(50px,10vw,90px);
    font-weight:800;
    letter-spacing:2px;
}

nav{
    width:92%;
    max-width:900px;
    margin:auto;
    padding:12px;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    border-radius:50px;

    backdrop-filter:blur(20px);
}

nav a{
    color:#ddd6fe;
    text-decoration:none;

    padding:12px 20px;
    border-radius:30px;

    transition:.3s;
}

nav a:hover{
    color:white;
    background:rgba(139,92,246,.25);
    transform:translateY(-3px);
}

main{
    padding:60px 20px 90px;
}

.contact{
    max-width:900px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.box{
    padding:35px 22px;

    text-align:center;

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,255,255,.14);

    backdrop-filter:blur(25px);

    transition:.4s;

    animation:appear .7s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.box:hover{
    transform:translateY(-8px);

    border-color:
        rgba(216,180,254,.35);

    box-shadow:
        0 25px 70px rgba(124,58,237,.18);
}

.icon{
    font-size:38px;
    margin-bottom:18px;
}

.box h2{
    font-size:21px;
    margin-bottom:12px;
}

.box p{
    color:#aaa8b8;
    line-height:1.7;
    word-break:break-word;
}

.box a{
    color:#c084fc;
    text-decoration:none;
}

footer{
    text-align:center;
    padding:35px;
    color:#777384;
    font-size:14px;
}

@media(max-width:700px){

    h1{
        font-size:52px;
    }

    nav{
        border-radius:25px;
    }

    nav a{
        padding:10px 14px;
    }

    .contact{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>

    <div class="badge">
        GET IN TOUCH
    </div>

    <h1>
        Contact Us
    </h1>

</header>


<nav>

    <a href="index.html">
        Home
    </a>

    <a href="about.html">
        About
    </a>

    <a href="courses.html">
        Courses
    </a>

    <a href="contact.html">
        Contact
    </a>

</nav>


<main>

<div class="contact">


    <div class="box">

        <div class="icon">
            📧
        </div>

        <h2>
            Email
        </h2>

        <p>
            <a
                id="email"
                href="mailto:college@example.com"
            >
                college@example.com
            </a>
        </p>

    </div>


    <div class="box">

        <div class="icon">
            📱
        </div>

        <h2>
            Phone
        </h2>

        <p>
            <a
                id="phone"
                href="tel:+919876543210"
            >
                +91 98765 43210
            </a>
        </p>

    </div>


    <div class="box">

        <div class="icon">
            📍
        </div>

        <h2>
            Address
        </h2>

        <p id="address">
            Your College Address
        </p>

    </div>


</div>

</main>


<footer>

    © 2026 College Portal

</footer>


<script>

const saved =
    localStorage.getItem("collegeData");

if(saved){

    const data =
        JSON.parse(saved);


    const email =
        document.getElementById("email");

    const phone =
        document.getElementById("phone");

    const address =
        document.getElementById("address");


    if(data.email){

        email.textContent =
            data.email;

        email.href =
            "mailto:" + data.email;

    }


    if(data.phone){

        phone.textContent =
            data.phone;

        phone.href =
            "tel:" +
            data.phone.replace(
                /[^0-9+]/g,
                ""
            );

    }


    if(data.address){

        address.textContent =
            data.address;

    }

}

</script>

</body>
</html>
